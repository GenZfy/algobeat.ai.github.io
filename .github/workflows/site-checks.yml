name: Website analytics checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check loader syntax
        run: node --check analytics.js
      - name: Verify consent and bundle integration
        run: node --test --test-isolation=none tests/analytics.test.mjs
